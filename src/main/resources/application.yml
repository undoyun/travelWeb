spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/travel
    username: root
    password: root

  sql:
    init:
      # mode: always
      platform: mysql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  profiles:
    include:
      - oauth

# 파일 업로드 경로 설정
app:
  upload:
    dir: ${user.home}/uploads/travel
