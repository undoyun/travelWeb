<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワクワク:여행 일정 수정</title>
    <!-- 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- 아이콘용(폰트어썸) CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- 드래그 앤 드롭 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" th:href="@{/css/itineraries/itineraryEdit.css}">
</head>

<body>
    <div class="container">
        <h1><i class="fas fa-edit"></i> 여행 일정 수정</h1>
        <p class="subtitle">일정을 드래그하여 순서를 변경하거나, 새로운 일정을 추가/삭제할 수 있습니다.</p>

        <form th:action="@{/itineraries/confirm}" method="post" id="editForm">
            <!-- Hidden input for TravelPlan ID -->
            <input type="hidden" name="planId" th:value="${planId}" />

            <!-- Hidden textarea holding the itinerary JSON -->
            <textarea id="itineraryArea" name="editedItinerary" rows="10" cols="80" style="display:none;"
                th:text="${itineraryJson}"></textarea>
            <!-- Hidden inputs for plan details -->
            <input type="hidden" name="planName" id="hiddenPlanName" />
            <input type="hidden" name="planPhoto" id="hiddenPlanPhoto" />
            <input type="hidden" name="planDescription" id="hiddenPlanDescription" />

            <!-- 일정 표시 영역 -->
            <div class="itinerary-container" id="itineraryContainer">
                <!-- 로딩 스피너 -->
                <div class="loading-spinner">
                    <i class="fas fa-spinner"></i>
                </div>
            </div>

            <!-- 새 날짜 추가 버튼 -->
            <div class="add-day-container">
                <button type="button" class="btn" id="btnAddDay">
                    <i class="fas fa-plus"></i> 새 날짜 추가
                </button>
            </div>

            <!-- 버튼 영역 -->
            <div class="btn-container">
                <button type="button" class="btn back-btn" onclick="history.back()">이전으로</button>
                <button type="button" class="btn submit-btn" id="btnOpenModal">일정 확정하기</button>
            </div>
        </form>

        <!-- 모달 (추가 정보 입력) -->
        <div id="confirmModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fas fa-check-circle"></i> 여행 정보 입력</h2>
                    <span class="close-btn" id="btnCloseModal">&times;</span>
                </div>

                <div class="modal-body">
                    <div class="form-group">
                        <label for="planName">여행 이름</label>
                        <input type="text" id="planName" name="planName" placeholder="예) 부산 바다여행" />
                    </div>

                    <div class="form-group">
                        <label for="planPhotoUpload">여행 대표 사진</label>
                        <div class="photo-upload-container">
                            <div class="photo-preview" id="photoPreview">
                                <i class="fas fa-image"></i>
                                <span>사진을 선택해주세요</span>
                            </div>
                            <input type="file" id="planPhotoUpload" accept="image/*" />
                            <input type="hidden" id="planPhoto" name="planPhoto" />
                            <button type="button" class="btn photo-btn" id="btnSelectPhoto">사진 선택</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="planDescription">여행 설명</label>
                        <textarea id="planDescription" name="planDescription" rows="4"
                            placeholder="여행에 대한 간단한 설명을 입력해주세요."></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn back-btn" id="btnCancelModal">취소</button>
                    <button type="button" class="btn submit-btn" id="btnSubmitModal">확정하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 템플릿 (새 일정 추가용) -->
    <template id="scheduleItemTemplate">
        <div class="schedule-item" draggable="true">
            <div class="schedule-time">
                <input type="time" class="time-input" value="09:00">
            </div>
            <div class="schedule-content">
                <div class="content-form">
                    <select class="category-select">
                        <option value="관광">관광</option>
                        <option value="식사">식사</option>
                        <option value="쇼핑">쇼핑</option>
                        <option value="체험">체험</option>
                        <option value="휴식">휴식</option>
                        <option value="이동">이동</option>
                        <option value="문화">문화</option>
                    </select>
                    <input type="text" class="location-input" placeholder="장소">
                    <div class="details-row">
                        <input type="text" class="duration-input" placeholder="소요시간" value="1시간">
                        <input type="text" class="cost-input" placeholder="비용" value="0 KRW">
                    </div>
                </div>
            </div>
            <div class="schedule-actions">
                <button type="button" class="btn-icon delete-schedule"><i class="fas fa-trash-alt"></i></button>
            </div>
        </div>
    </template>

    <!-- 템플릿 (새 날짜 추가용) -->
    <template id="dayTemplate">
        <div class="day-container">
            <div class="day-header">
                <h3 class="day-title">Day <span class="day-number">1</span> <span class="day-date">2025-03-11</span>
                </h3>
                <div class="day-actions">
                    <button type="button" class="btn-icon add-schedule"><i class="fas fa-plus"></i></button>
                    <button type="button" class="btn-icon delete-day"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
            <div class="schedule-container">
                <!-- 여기에 일정 항목이 추가됩니다 -->
            </div>
        </div>
    </template>

    <!-- 도움말 모달 -->
    <div id="helpModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-question-circle"></i> 일정 편집 도움말</h2>
                <span class="close-btn" id="closeHelpModal">&times;</span>
            </div>
            <div class="modal-body">
                <h3>기본 기능</h3>
                <ul>
                    <li><i class="fas fa-plus"></i> - 새 일정 추가</li>
                    <li><i class="fas fa-trash-alt"></i> - 일정/날짜 삭제</li>
                    <li><i class="fas fa-arrows-alt"></i> - 드래그하여 순서 변경</li>
                </ul>

                <h3>드래그 앤 드롭</h3>
                <ul>
                    <li>일정을 드래그하여 순서를 변경할 수 있습니다.</li>
                    <li>날짜 헤더를 드래그하여 날짜 순서를 변경할 수 있습니다.</li>
                </ul>

                <h3>일정 편집</h3>
                <ul>
                    <li>시간과 내용을 직접 수정할 수 있습니다.</li>
                    <li>각 날짜별로 일정을 추가하거나 삭제할 수 있습니다.</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 도움말 버튼 -->
    <button id="helpBtn" class="help-btn">
        <i class="fas fa-question-circle"></i>
    </button>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 전역 변수
            let itineraryData = null;
            const itineraryContainer = document.getElementById('itineraryContainer');
            const itineraryArea = document.getElementById('itineraryArea');
            const btnAddDay = document.getElementById('btnAddDay');

            // 모달 요소
            const confirmModal = document.getElementById('confirmModal');
            const btnOpenModal = document.getElementById('btnOpenModal');
            const btnCloseModal = document.getElementById('btnCloseModal');
            const btnCancelModal = document.getElementById('btnCancelModal');
            const btnSubmitModal = document.getElementById('btnSubmitModal');

            // 사진 업로드 관련 요소
            const btnSelectPhoto = document.getElementById('btnSelectPhoto');
            const planPhotoUpload = document.getElementById('planPhotoUpload');
            const photoPreview = document.getElementById('photoPreview');
            const planPhoto = document.getElementById('planPhoto');

            // 도움말 모달 제어
            const helpBtn = document.getElementById('helpBtn');
            const helpModal = document.getElementById('helpModal');
            const closeHelpModal = document.getElementById('closeHelpModal');

            helpBtn.addEventListener('click', function () {
                helpModal.style.display = 'block';
            });

            closeHelpModal.addEventListener('click', function () {
                helpModal.style.display = 'none';
            });

            window.addEventListener('click', function (event) {
                if (event.target === helpModal) {
                    helpModal.style.display = 'none';
                }
            });

            // 새 날짜 추가 버튼 이벤트
            btnAddDay.addEventListener('click', function () {
                addNewDay();
            });

            // 일정 데이터 로드
            loadItineraryData();

            function loadItineraryData() {
                try {
                    // 로딩 스피너 표시
                    itineraryContainer.innerHTML = `
                        <div class="loading-spinner">
                            <i class="fas fa-spinner"></i>
                        </div>
                    `;

                    // JSON 문자열 가져오기
                    const jsonData = itineraryArea.value;
                    console.log("JSON 데이터:", jsonData);

                    // JavaScript로 직접 파싱
                    try {
                        const parsedData = JSON.parse(jsonData);
                        console.log("파싱된 데이터:", parsedData);

                        // 원본 데이터 저장
                        const originalData = parsedData;

                        // 데이터 구조 변환 - 수정된 부분
                        if (parsedData.travelPlan && parsedData.travelPlan.itinerary) {
                            // travelPlan.itinerary 구조를 days 구조로 변환
                            itineraryData = {
                                days: parsedData.travelPlan.itinerary.map(day => {
                                    return {
                                        date: day.date,
                                        schedules: day.schedule.map(item => {
                                            return {
                                                time: item.departureTime,
                                                content: `${item.category} - ${item.location} (${item.duration}, ${item.cost})`
                                            };
                                        })
                                    };
                                }),
                                // 원본 데이터도 저장
                                originalData: originalData
                            };
                            console.log("변환된 데이터:", itineraryData);
                        } else if (parsedData.days) {
                            // 이미 days 구조인 경우 그대로 사용하되, 원본 데이터도 저장
                            itineraryData = parsedData;
                            itineraryData.originalData = originalData;
                        } else {
                            // 다른 구조인 경우 기본 구조 생성
                            itineraryData = {
                                days: [{
                                    date: new Date().toISOString().split('T')[0],
                                    schedules: [{
                                        time: '09:00',
                                        content: '새 일정'
                                    }]
                                }],
                                originalData: originalData
                            };
                            console.error("지원되지 않는 데이터 구조:", parsedData);
                        }

                        // 로딩 스피너 제거 및 일정 렌더링
                        setTimeout(() => {
                            renderItinerary();
                        }, 500);
                    } catch (parseError) {
                        console.error('JSON 파싱 오류:', parseError);
                        itineraryContainer.innerHTML = `
                            <div class="error-message">
                                <i class="fas fa-exclamation-triangle"></i>
                                <p>일정 데이터를 불러오는 중 오류가 발생했습니다.</p>
                                <p>다시 시도해주세요.</p>
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error('일정 데이터 로드 오류:', error);
                    itineraryContainer.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>일정 데이터를 불러오는 중 오류가 발생했습니다.</p>
                            <p>다시 시도해주세요.</p>
                        </div>
                    `;
                }
            }

            // 일정 렌더링 함수
            function renderItinerary() {
                itineraryContainer.innerHTML = '';

                if (!itineraryData || !itineraryData.days || itineraryData.days.length === 0) {
                    itineraryContainer.innerHTML = `
                        <div class="empty-itinerary">
                            <i class="fas fa-calendar-times"></i>
                            <p>일정 데이터가 없습니다.</p>
                            <p>아래 버튼을 클릭하여 새 날짜를 추가해보세요.</p>
                        </div>
                    `;
                    return;
                }

                // 각 날짜별 일정 렌더링
                itineraryData.days.forEach((day, dayIndex) => {
                    const dayContainer = createDayElement(day, dayIndex);
                    itineraryContainer.appendChild(dayContainer);

                    // 일정 항목 렌더링
                    const scheduleContainer = dayContainer.querySelector('.schedule-container');
                    day.schedules.forEach((schedule, scheduleIndex) => {
                        const scheduleItem = createScheduleElement(schedule, dayIndex, scheduleIndex);
                        scheduleContainer.appendChild(scheduleItem);
                    });

                    // 드래그 앤 드롭 설정
                    setupDragAndDrop(scheduleContainer);
                });

                // 날짜 컨테이너 드래그 앤 드롭 설정
                setupDaysDragAndDrop();
            }

            // 날짜 요소 생성 함수
            function createDayElement(day, dayIndex) {
                const template = document.getElementById('dayTemplate');
                const dayElement = template.content.cloneNode(true).querySelector('.day-container');

                // 날짜 정보 설정
                dayElement.dataset.dayIndex = dayIndex;
                dayElement.querySelector('.day-number').textContent = dayIndex + 1;
                dayElement.querySelector('.day-date').textContent = day.date;

                // 일정 추가 버튼 이벤트
                dayElement.querySelector('.add-schedule').addEventListener('click', function () {
                    addNewSchedule(dayIndex);
                });

                // 날짜 삭제 버튼 이벤트
                dayElement.querySelector('.delete-day').addEventListener('click', function () {
                    if (confirm('이 날짜의 모든 일정이 삭제됩니다. 계속하시겠습니까?')) {
                        deleteDay(dayIndex);
                    }
                });

                return dayElement;
            }

            // 일정 요소 생성 함수
            function createScheduleElement(schedule, dayIndex, scheduleIndex) {
                const template = document.getElementById('scheduleItemTemplate');
                const scheduleElement = template.content.cloneNode(true).querySelector('.schedule-item');

                // 일정 정보 설정
                scheduleElement.dataset.dayIndex = dayIndex;
                scheduleElement.dataset.scheduleIndex = scheduleIndex;

                // 시간 설정
                const timeInput = scheduleElement.querySelector('.time-input');
                timeInput.value = schedule.time || '09:00';
                timeInput.addEventListener('change', function () {
                    updateScheduleData(dayIndex, scheduleIndex, 'time', this.value);
                });

                // 내용에서 카테고리, 위치, 소요시간, 비용 추출
                let category = "관광";
                let location = "";
                let duration = "1시간";
                let cost = "0 KRW";

                // 기존 내용 파싱
                if (schedule.content) {
                    const contentParts = schedule.content.split(' - ');
                    if (contentParts.length >= 2) {
                        category = contentParts[0].trim();

                        // 위치와 (시간, 비용) 분리
                        const locationParts = contentParts[1].split(' (');
                        if (locationParts.length >= 2) {
                            location = locationParts[0].trim();

                            // (시간, 비용) 파싱
                            const detailsPart = locationParts[1].replace(')', '').split(', ');
                            if (detailsPart.length >= 2) {
                                duration = detailsPart[0].trim();
                                cost = detailsPart[1].trim();
                            } else if (detailsPart.length === 1) {
                                duration = detailsPart[0].trim();
                            }
                        } else {
                            location = locationParts[0].trim();
                        }
                    } else {
                        location = schedule.content;
                    }
                }

                // 카테고리 설정
                const categorySelect = scheduleElement.querySelector('.category-select');
                categorySelect.value = category;
                categorySelect.addEventListener('change', function () {
                    updateContentField(dayIndex, scheduleIndex, scheduleElement);
                });

                // 위치 설정
                const locationInput = scheduleElement.querySelector('.location-input');
                locationInput.value = location;
                locationInput.addEventListener('change', function () {
                    updateContentField(dayIndex, scheduleIndex, scheduleElement);
                });

                // 소요시간 설정
                const durationInput = scheduleElement.querySelector('.duration-input');
                durationInput.value = duration;
                durationInput.addEventListener('change', function () {
                    updateContentField(dayIndex, scheduleIndex, scheduleElement);
                });

                // 비용 설정
                const costInput = scheduleElement.querySelector('.cost-input');
                costInput.value = cost;
                costInput.addEventListener('change', function () {
                    updateContentField(dayIndex, scheduleIndex, scheduleElement);
                });

                // 삭제 버튼 이벤트
                scheduleElement.querySelector('.delete-schedule').addEventListener('click', function () {
                    deleteSchedule(dayIndex, scheduleIndex);
                });

                return scheduleElement;
            }

            // 내용 필드 업데이트 함수
            function updateContentField(dayIndex, scheduleIndex, scheduleElement) {
                const category = scheduleElement.querySelector('.category-select').value;
                const location = scheduleElement.querySelector('.location-input').value;
                const duration = scheduleElement.querySelector('.duration-input').value;
                const cost = scheduleElement.querySelector('.cost-input').value;

                // 내용 형식: "카테고리 - 위치 (시간, 비용)"
                const content = `${category} - ${location} (${duration}, ${cost})`;

                // 데이터 업데이트
                updateScheduleData(dayIndex, scheduleIndex, 'content', content);
            }

            // 일정 데이터 업데이트 함수
            function updateScheduleData(dayIndex, scheduleIndex, field, value) {
                itineraryData.days[dayIndex].schedules[scheduleIndex][field] = value;
                updateItineraryJson();
            }

            // 새 일정 추가 함수
            function addNewSchedule(dayIndex) {
                const newSchedule = {
                    time: '12:00',
                    content: '새 일정'
                };

                itineraryData.days[dayIndex].schedules.push(newSchedule);

                // 새 일정 요소 생성 및 추가
                const scheduleContainer = document.querySelector(`.day-container[data-day-index="${dayIndex}"] .schedule-container`);
                const scheduleElement = createScheduleElement(newSchedule, dayIndex, itineraryData.days[dayIndex].schedules.length - 1);
                scheduleContainer.appendChild(scheduleElement);

                updateItineraryJson();
            }

            // 일정 삭제 함수
            function deleteSchedule(dayIndex, scheduleIndex) {
                // 데이터에서 일정 삭제
                itineraryData.days[dayIndex].schedules.splice(scheduleIndex, 1);

                // UI 업데이트
                renderItinerary();
                updateItineraryJson();
            }

            // 날짜 삭제 함수
            function deleteDay(dayIndex) {
                // 데이터에서 날짜 삭제
                itineraryData.days.splice(dayIndex, 1);

                // UI 업데이트
                renderItinerary();
                updateItineraryJson();
            }

            // 새 날짜 추가 함수
            function addNewDay() {
                // 날짜 결정 (마지막 날 다음날 또는 오늘)
                let newDate = new Date();

                if (itineraryData && itineraryData.days && itineraryData.days.length > 0) {
                    // 현재 일정의 날짜들 정렬
                    const dates = itineraryData.days.map(d => new Date(d.date));
                    const latestDate = new Date(Math.max(...dates));
                    // 다음날로 설정
                    latestDate.setDate(latestDate.getDate() + 1);
                    newDate = latestDate;
                } else if (itineraryData.originalData &&
                    itineraryData.originalData.travelPlan &&
                    itineraryData.originalData.travelPlan.endDate) {
                    // 원본 일정의 종료일 이후로 설정
                    const endDate = new Date(itineraryData.originalData.travelPlan.endDate);
                    endDate.setDate(endDate.getDate() + 1);
                    newDate = endDate;
                }

                const dateStr = newDate.toISOString().split('T')[0];

                const newDay = {
                    date: dateStr,
                    schedules: [{
                        time: '09:00',
                        content: '새 일정'
                    }]
                };

                if (!itineraryData) {
                    itineraryData = { days: [] };
                }

                if (!itineraryData.days) {
                    itineraryData.days = [];
                }

                itineraryData.days.push(newDay);

                // UI 업데이트
                renderItinerary();
                updateItineraryJson();
            }

            // 일정 JSON 업데이트 함수
            function updateItineraryJson() {
                // 원본 데이터 사용
                let originalData = itineraryData.originalData || {};

                // 원본 travelPlan 정보 유지
                let travelPlanData = originalData.travelPlan || {};

                // 필수 필드 기본값 설정
                if (!travelPlanData.plan_Id) {
                    travelPlanData.plan_Id = generateUUID();
                }

                if (!travelPlanData.departLocation) travelPlanData.departLocation = "서울";
                if (!travelPlanData.destination) travelPlanData.destination = "부산";
                if (!travelPlanData.transportation) travelPlanData.transportation = "버스";
                if (!travelPlanData.purpose) travelPlanData.purpose = "관광";
                if (!travelPlanData.budget) travelPlanData.budget = 500000;
                if (!travelPlanData.density) travelPlanData.density = "적당히";
                if (!travelPlanData.travelMode) travelPlanData.travelMode = "대중교통";
                if (!travelPlanData.departureTime) travelPlanData.departureTime = "09:00";
                if (!travelPlanData.returnTime) travelPlanData.returnTime = "18:00";

                // 날짜 범위 설정 (첫날과 마지막 날 기준)
                if (itineraryData.days && itineraryData.days.length > 0) {
                    const sortedDays = [...itineraryData.days].sort((a, b) => new Date(a.date) - new Date(b.date));
                    travelPlanData.startDate = sortedDays[0].date;
                    travelPlanData.endDate = sortedDays[sortedDays.length - 1].date;
                }

                // 변환된 itinerary 데이터 생성
                const convertedItinerary = itineraryData.days.map(day => {
                    // 원본 날짜 데이터 찾기 (날짜가 일치하는 항목)
                    let originalDay = {
                        weather: "맑음",
                        totalCost: "0 KRW"
                    };

                    if (originalData.travelPlan && originalData.travelPlan.itinerary) {
                        const matchingDay = originalData.travelPlan.itinerary.find(d => d.date === day.date);
                        if (matchingDay) {
                            originalDay.weather = matchingDay.weather || originalDay.weather;
                            originalDay.totalCost = matchingDay.totalCost || originalDay.totalCost;
                        }
                    }

                    // 일정 항목 변환
                    const convertedSchedule = day.schedules.map(schedule => {
                        // 내용에서 카테고리, 위치, 시간, 비용 추출
                        let category = "관광";
                        let location = "";
                        let duration = "1시간";
                        let cost = "0 KRW";

                        // "카테고리 - 위치 (시간, 비용)" 형식 파싱
                        if (schedule.content) {
                            const contentParts = schedule.content.split(' - ');
                            if (contentParts.length >= 2) {
                                category = contentParts[0].trim();

                                // 위치와 (시간, 비용) 분리
                                const locationParts = contentParts[1].split(' (');
                                if (locationParts.length >= 2) {
                                    location = locationParts[0].trim();

                                    // (시간, 비용) 파싱
                                    const detailsPart = locationParts[1].replace(')', '').split(', ');
                                    if (detailsPart.length >= 2) {
                                        duration = detailsPart[0].trim();
                                        cost = detailsPart[1].trim();
                                    } else if (detailsPart.length === 1) {
                                        duration = detailsPart[0].trim();
                                    }
                                } else {
                                    location = locationParts[0].trim();
                                }
                            } else {
                                location = schedule.content;
                            }
                        }

                        return {
                            departureTime: schedule.time || "09:00",
                            category: category,
                            location: location,
                            duration: duration,
                            cost: cost
                        };
                    });

                    return {
                        date: day.date,
                        weather: originalDay.weather,
                        totalCost: originalDay.totalCost,
                        schedule: convertedSchedule
                    };
                });

                // 최종 travelPlan 객체 구성
                travelPlanData.itinerary = convertedItinerary;

                // 결과 JSON 저장
                itineraryArea.value = JSON.stringify({ travelPlan: travelPlanData });
            }

            // UUID 생성 함수
            function generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                    const r = Math.random() * 16 | 0,
                        v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            // 일정 항목 드래그 앤 드롭 설정
            function setupDragAndDrop(container) {
                new Sortable(container, {
                    animation: 150,
                    ghostClass: 'schedule-item-ghost',
                    onEnd: function (evt) {
                        const dayIndex = parseInt(evt.item.dataset.dayIndex);
                        const oldIndex = parseInt(evt.item.dataset.scheduleIndex);
                        const newIndex = evt.newIndex;

                        // 데이터 순서 변경
                        const movedItem = itineraryData.days[dayIndex].schedules.splice(oldIndex, 1)[0];
                        itineraryData.days[dayIndex].schedules.splice(newIndex, 0, movedItem);

                        // UI 업데이트
                        renderItinerary();
                        updateItineraryJson();
                    }
                });
            }

            // 날짜 컨테이너 드래그 앤 드롭 설정
            function setupDaysDragAndDrop() {
                new Sortable(itineraryContainer, {
                    animation: 150,
                    handle: '.day-header',
                    ghostClass: 'day-container-ghost',
                    onEnd: function (evt) {
                        const oldIndex = parseInt(evt.item.dataset.dayIndex);
                        const newIndex = evt.newIndex;

                        // 데이터 순서 변경
                        const movedDay = itineraryData.days.splice(oldIndex, 1)[0];
                        itineraryData.days.splice(newIndex, 0, movedDay);

                        // UI 업데이트
                        renderItinerary();
                        updateItineraryJson();
                    }
                });
            }

            // 모달 열기
            btnOpenModal.addEventListener('click', function () {
                // 모달 필드 초기화
                document.getElementById('planName').value = '';
                document.getElementById('planDescription').value = '';
                photoPreview.innerHTML = '<i class="fas fa-image"></i><span>사진을 선택해주세요</span>';
                photoPreview.style.backgroundImage = '';
                planPhoto.value = '';

                confirmModal.style.display = 'block';
            });

            // 모달 닫기
            btnCloseModal.addEventListener('click', function () {
                confirmModal.style.display = 'none';
            });

            btnCancelModal.addEventListener('click', function () {
                confirmModal.style.display = 'none';
            });

            // 모달 외부 클릭 시 닫기
            window.addEventListener('click', function (event) {
                if (event.target === confirmModal) {
                    confirmModal.style.display = 'none';
                }
            });

            // 사진 선택 버튼 클릭
            btnSelectPhoto.addEventListener('click', function () {
                planPhotoUpload.click();
            });

            // 사진 업로드 처리
            planPhotoUpload.addEventListener('change', function () {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        photoPreview.innerHTML = '';
                        photoPreview.style.backgroundImage = `url(${e.target.result})`;
                        planPhoto.value = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // 모달 제출
            btnSubmitModal.addEventListener('click', function () {
                const planName = document.getElementById('planName').value.trim();

                if (!planName) {
                    alert('여행 이름은 필수 입력 항목입니다.');
                    return;
                }

                // JSON 데이터 유효성 검증
                try {
                    // 현재 저장된 JSON 문자열 확인
                    const jsonData = itineraryArea.value;
                    if (!jsonData || jsonData.trim() === '') {
                        alert('유효한 일정 데이터가 없습니다. 일정을 추가해주세요.');
                        return;
                    }

                    // JSON 파싱 테스트
                    const parsedData = JSON.parse(jsonData);
                    if (!parsedData || !parsedData.travelPlan) {
                        alert('일정 데이터 형식이 올바르지 않습니다.');
                        return;
                    }

                    console.log('일정 JSON 데이터 확인 완료:', parsedData);
                } catch (error) {
                    console.error('JSON 파싱 오류:', error);
                    alert('일정 데이터에 오류가 있습니다: ' + error.message);
                    return;
                }

                // 히든 필드에 값 설정
                document.getElementById('hiddenPlanName').value = planName;
                document.getElementById('hiddenPlanPhoto').value = planPhoto.value;
                document.getElementById('hiddenPlanDescription').value = document.getElementById('planDescription').value.trim();

                // 폼 제출
                document.getElementById('editForm').submit();
            });
        });
    </script>
</body>
