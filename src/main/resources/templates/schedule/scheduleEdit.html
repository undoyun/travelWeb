<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワクワク:여행 일정 수정</title>
    <!-- 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- 아이콘용(폰트어썸) CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 드래그 앤 드롭 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" th:href="@{/css/schedule/editSchedule.css}">
</head>

<body>
    <div class="container">
        <h1><i class="fas fa-edit"></i> 여행 일정 수정</h1>
        <p class="subtitle">일정을 드래그하여 순서를 변경하거나, 새로운 일정을 추가/삭제할 수 있습니다.</p>

        <form th:action="@{/schedule/edit/{id}(id=${scheduleItem.id})}" method="post" id="editForm">
            <!-- Hidden textarea holding the itinerary JSON -->
            <textarea id="itineraryArea" name="editedItinerary" rows="10" cols="80" style="display:none;"
                th:text="${scheduleItem.scheduleJson}"></textarea>
            <!-- Hidden inputs for plan details -->
            <input type="hidden" name="planName" id="hiddenPlanName" />
            <input type="hidden" name="planPhoto" id="hiddenPlanPhoto" />
            <input type="hidden" name="planDescription" id="hiddenPlanDescription" />

            <!-- 일정 표시 영역 -->
            <div class="itinerary-container" id="itineraryContainer">
                <!-- 로딩 스피너 -->
                <div class="loading-spinner">
                    <i class="fas fa-spinner"></i>
                </div>
            </div>

            <!-- 새 날짜 추가 버튼 -->
            <div class="add-day-container">
                <button type="button" class="btn" id="btnAddDay">
                    <i class="fas fa-plus"></i> 새 날짜 추가
                </button>
            </div>

            <!-- 버튼 영역 -->
            <div class="btn-container">
                <button type="button" class="btn back-btn" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i> 이전으로
                </button>
                <button type="button" class="btn submit-btn" id="btnOpenModal">
                    <i class="fas fa-check"></i> 일정 확정하기
                </button>
            </div>
        </form>

        <!-- 모달 (추가 정보 입력) -->
        <div id="confirmModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fas fa-check-circle"></i> 여행 정보 입력</h2>
                    <span class="close-btn" id="btnCloseModal">&times;</span>
                </div>

                <div class="modal-body">
                    <div class="form-group">
                        <label for="planName">여행 이름</label>
                        <input type="text" id="planName" name="planName" th:value="${scheduleItem.planName}" 
                            placeholder="여행 이름을 입력해주세요" />
                    </div>

                    <div class="form-group">
                        <label for="planPhotoUpload">여행 대표 사진</label>
                        <div class="photo-upload-container">
                            <div class="photo-preview" id="photoPreview" th:style="${scheduleItem.planPhoto != null && !scheduleItem.planPhoto.isEmpty()} ? |background-image: url('${scheduleItem.planPhoto}')|">
                                <i class="fas fa-image"></i>
                                <span>사진을 선택해주세요</span>
                            </div>
                            <input type="file" id="planPhotoUpload" accept="image/*" />
                            <input type="hidden" id="planPhoto" name="planPhoto" th:value="${scheduleItem.planPhoto}" />
                            <button type="button" class="photo-btn" id="btnSelectPhoto">
                                <i class="fas fa-camera"></i> 사진 선택
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="planDescription">여행 설명</label>
                        <textarea id="planDescription" name="planDescription" rows="4" 
                            placeholder="여행에 대한 설명을 입력해주세요" th:text="${scheduleItem.planDescription}"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn back-btn" id="btnCancelModal">
                        <i class="fas fa-times"></i> 취소
                    </button>
                    <button type="button" class="btn submit-btn" id="btnSubmitModal">
                        <i class="fas fa-check"></i> 확정하기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 템플릿 (새 일정 추가용) -->
    <template id="scheduleItemTemplate">
        <div class="schedule-item" draggable="true">
            <div class="schedule-time">
                <input type="time" class="time-input" value="09:00">
            </div>
            <div class="schedule-content">
                <div class="content-form">
                    <select class="category-select">
                        <option value="관광">관광</option>
                        <option value="식사">식사</option>
                        <option value="쇼핑">쇼핑</option>
                        <option value="체험">체험</option>
                        <option value="휴식">휴식</option>
                        <option value="이동">이동</option>
                        <option value="문화">문화</option>
                    </select>
                    <input type="text" class="location-input" placeholder="장소를 입력해주세요">
                    <div class="details-row">
                        <input type="text" class="duration-input" placeholder="소요시간" value="1시간">
                        <input type="text" class="cost-input" placeholder="비용" value="0 KRW">
                    </div>
                </div>
            </div>
            <div class="schedule-actions">
                <button type="button" class="btn-icon delete-schedule">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>
    </template>

    <!-- 템플릿 (새 날짜 추가용) -->
    <template id="dayTemplate">
        <div class="day-container">
            <div class="day-header">
                <h3 class="day-title">Day <span class="day-number">1</span> <span class="day-date">2025-03-11</span></h3>
                <div class="day-actions">
                    <button type="button" class="btn-icon add-schedule">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button type="button" class="btn-icon delete-day">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>
            <div class="schedule-container">
                <!-- 여기에 일정 항목이 추가됩니다 -->
            </div>
        </div>
    </template>

    <!-- 도움말 모달 -->
    <div id="helpModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-question-circle"></i> 일정 편집 도움말</h2>
                <span class="close-btn" id="closeHelpModal">&times;</span>
            </div>
            <div class="modal-body">
                <h3>기본 기능</h3>
                <ul>
                    <li><i class="fas fa-plus"></i> - 새 일정 추가</li>
                    <li><i class="fas fa-trash-alt"></i> - 일정/날짜 삭제</li>
                    <li><i class="fas fa-arrows-alt"></i> - 드래그하여 순서 변경</li>
                </ul>

                <h3>드래그 앤 드롭</h3>
                <ul>
                    <li>일정을 드래그하여 순서를 변경할 수 있습니다.</li>
                    <li>날짜 헤더를 드래그하여 날짜 순서를 변경할 수 있습니다.</li>
                </ul>

                <h3>일정 편집</h3>
                <ul>
                    <li>시간과 내용을 직접 수정할 수 있습니다.</li>
                    <li>각 날짜별로 일정을 추가하거나 삭제할 수 있습니다.</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 도움말 버튼 -->
    <button id="helpBtn" class="help-btn">
        <i class="fas fa-question-circle"></i>
    </button>

    <script th:src="@{/js/schedule/editSchedule.js}"></script>
</body>

</html>
