<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワクワク: 회원가입</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/users/register.css}">

    <!-- reCAPTCHA 스크립트 주석 해제 -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>

    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <div class="logo-area">
                    <div class="register-logo">ワクワク</div>
                    <h1>회원가입</h1>
                    <p>간단한 정보 입력으로 부산 여행 서비스를 이용하세요</p>
                </div>
            </div>

            <div class="register-form-container">
                <!-- 모델 속성을 userCreateDto로 설정 -->
                <form id="registerForm" action="/users/register" method="post" th:object="${userCreateDto}">
                    <div class="register-form-group">
                        <label for="username">아이디</label>
                        <div class="input-with-button">
                            <input type="text" id="username" th:field="*{username}" placeholder="영문, 숫자 조합 (4-20자)"
                                required>
                            <button type="button" class="duplicate-check-btn" onclick="checkUsername()">중복 확인</button>
                        </div>
                        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-message"
                            style="color:red;"></span>
                        <div id="username-error" class="validation-message"></div>
                    </div>

                    <div class="register-form-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" th:field="*{password}" placeholder="8~16자의 영문, 숫자 사용"
                            required>
                        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"
                            style="color:red;"></span>
                        <div id="password-error" class="validation-message"></div>
                    </div>

                    <div class="register-form-group">
                        <label for="passwordConfirm">비밀번호 확인</label>
                        <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" placeholder="비밀번호 확인"
                            required>
                        <span th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"
                            class="error-message" style="color:red;"></span>
                        <div id="passwordConfirm-error" class="validation-message"></div>
                    </div>

                    <div class="register-form-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" th:field="*{name}" placeholder="실명을 입력해주세요" required>
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-message"
                            style="color:red;"></span>
                        <div id="name-error" class="validation-message"></div>
                    </div>

                    <div class="register-form-group">
                        <label for="nickname">닉네임</label>
                        <div class="input-with-button">
                            <input type="text" id="nickname" th:field="*{nickname}" placeholder="닉네임을 입력해주세요" required>
                            <button type="button" class="duplicate-check-btn" onclick="checkNickname()">중복 확인</button>
                        </div>
                        <span th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}" class="error-message"
                            style="color:red;"></span>
                        <div id="nickname-error" class="validation-message"></div>
                    </div>

                    <div class="register-form-group">
                        <label for="gender">성별</label>
                        <!-- 성별은 select box로 처리 -->
                        <select id="gender" th:field="*{gender}" required>
                            <option value="" disabled selected>성별 선택</option>
                            <option value="MALE">남성</option>
                            <option value="FEMALE">여성</option>
                        </select>
                        <span th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="error-message"
                            style="color:red;"></span>
                        <div id="gender-error" class="validation-message"></div>
                    </div>

                    <div class="register-form-group">
                        <label for="birthdate">생년월일</label>
                        <input type="date" id="birthdate" th:field="*{birthdate}" required>
                        <span th:if="${#fields.hasErrors('birthdate')}" th:errors="*{birthdate}" class="error-message"
                            style="color:red;"></span>
                        <div id="birthdate-error" class="validation-message"></div>
                    </div>

                    <div class="register-form-group">
                        <label for="email">이메일</label>
                        <div class="input-with-button">
                            <input type="email" id="email" th:field="*{email}" placeholder="이메일을 입력해주세요" required>
                            <button type="button" class="duplicate-check-btn" onclick="checkEmail()">중복 확인</button>
                        </div>
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"
                            style="color:red;"></span>
                        <div id="email-error" class="validation-message"></div>
                    </div>

                    <!-- reCAPTCHA UI 요소 수정 -->
                    <div class="register-form-group">
                        <div class="captcha-container">
                            <div class="g-recaptcha" data-sitekey="6Lci6-4qAAAAAOrpElVovC3DaaHBmM9x4lJLf2qL"></div>
                        </div>
                        <span th:if="${#fields.hasErrors('recaptchaResponse')}" th:errors="*{recaptchaResponse}"
                            class="error-message" style="color:red;"></span>
                        <div id="recaptchaResponse-error" class="validation-message"></div>
                    </div>

                    <button type="button" class="register-btn" onclick="submitForm()">가입하기</button>

                    <div class="login-link-container">
                        <p>이미 계정이 있으신가요? <a href="/users/login" class="login-link">로그인하기</a></p>
                    </div>
                </form>
            </div>

            <!-- 정책 링크 추가 -->
            <div class="policy-links">
                <a href="#">이용약관</a>
                <a href="#">개인정보처리방침</a>
                <a href="#">책임의 한계와 법적고지</a>
                <a href="#">회원정보 고객센터</a>
            </div>
        </div>
    </div>

    <!-- 스타일 추가 -->
    <style>
        .validation-message {
            font-size: 13px;
            margin-top: 5px;
            min-height: 18px;
        }

        .validation-message.success {
            color: green;
        }

        .validation-message.error {
            color: red;
        }
    </style>

    <!-- AJAX 중복 검사를 위한 스크립트 구역 -->
    <script>
        function checkUsername() {
            let username = document.getElementById("username").value;
            const errorElement = document.getElementById("username-error");

            if (!username) {
                errorElement.textContent = "아이디를 입력해주세요.";
                errorElement.className = "validation-message error";
                return;
            }

            fetch(`/api/users/check-username?username=${username}`)
                .then(response => response.text())
                .then(message => {
                    errorElement.textContent = message;
                    errorElement.className = "validation-message " + (message.includes("사용 가능") ? "success" : "error");
                })
                .catch(error => {
                    console.error("아이디 중복 확인 오류:", error);
                    errorElement.textContent = "중복 확인 중 오류가 발생했습니다.";
                    errorElement.className = "validation-message error";
                });
        }

        function checkNickname() {
            let nickname = document.getElementById("nickname").value;
            const errorElement = document.getElementById("nickname-error");

            if (!nickname) {
                errorElement.textContent = "닉네임을 입력해주세요.";
                errorElement.className = "validation-message error";
                return;
            }

            fetch(`/api/users/check-nickname?nickname=${nickname}`)
                .then(response => response.text())
                .then(message => {
                    errorElement.textContent = message;
                    errorElement.className = "validation-message " + (message.includes("사용 가능") ? "success" : "error");
                })
                .catch(error => {
                    console.error("닉네임 중복 확인 오류:", error);
                    errorElement.textContent = "중복 확인 중 오류가 발생했습니다.";
                    errorElement.className = "validation-message error";
                });
        }

        function checkEmail() {
            let email = document.getElementById("email").value;
            const errorElement = document.getElementById("email-error");

            if (!email) {
                errorElement.textContent = "이메일을 입력해주세요.";
                errorElement.className = "validation-message error";
                return;
            }

            fetch(`/api/users/check-email?email=${email}`)
                .then(response => response.text())
                .then(message => {
                    errorElement.textContent = message;
                    errorElement.className = "validation-message " + (message.includes("사용 가능") ? "success" : "error");
                })
                .catch(error => {
                    console.error("이메일 중복 확인 오류:", error);
                    errorElement.textContent = "중복 확인 중 오류가 발생했습니다.";
                    errorElement.className = "validation-message error";
                });
        }

        function submitForm() {
            // 모든 에러 메시지 초기화
            document.querySelectorAll('.validation-message').forEach(el => {
                el.textContent = '';
                el.className = 'validation-message';
            });

            // 폼 데이터 수집
            const form = document.getElementById('registerForm');
            const formData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                passwordConfirm: document.getElementById('passwordConfirm').value,
                name: document.getElementById('name').value,
                nickname: document.getElementById('nickname').value,
                gender: document.getElementById('gender').value,
                birthdate: document.getElementById('birthdate').value,
                email: document.getElementById('email').value,
                recaptchaResponse: document.querySelector('[name="g-recaptcha-response"]').value
            };

            // AJAX로 데이터 전송
            fetch('/api/users/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errors => {
                            throw errors;
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    // 성공 시 로그인 페이지로 리다이렉트
                    alert(data.message);
                    window.location.href = '/users/login';
                })
                .catch(errors => {
                    // 유효성 검사 오류 처리
                    Object.keys(errors).forEach(field => {
                        const errorElement = document.getElementById(`${field}-error`);
                        if (errorElement) {
                            errorElement.textContent = errors[field];
                            errorElement.className = "validation-message error";
                        }
                    });
                });
        }

        // 약관 전체 동의 기능
        function toggleAllTerms() {
            const allCheckbox = document.getElementById('agreeAll');
            const checkboxes = document.querySelectorAll('.terms-checkbox');
            
            checkboxes.forEach(checkbox => {
                checkbox.checked = allCheckbox.checked;
            });
        }

        // 개별 약관 체크 시 전체 동의 체크박스 상태 업데이트
        document.addEventListener('DOMContentLoaded', function() {
            const allCheckbox = document.getElementById('agreeAll');
            const checkboxes = document.querySelectorAll('.terms-checkbox');
            
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const allChecked = Array.from(checkboxes).every(box => box.checked);
                    allCheckbox.checked = allChecked;
                });
            });
        });
    </script>
    <script th:src="@{/js/main/nav.js}"></script>
</body>

</html>
