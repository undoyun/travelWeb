      padding: 10px 20px;

    // "여행 일정 보기" 버튼 클릭 시 호줄되는 함수
    function displayItinerary() {
      const itineraryContainer = document.getElementById("itinerary");

      // 이미 내용이 있다면 초기화
      itineraryContainer.innerHTML = "";

      const itinerary = tripData.trip.itinerary;

      itinerary.forEach(dayInfo => {
        const dayTitle = document.createElement("h2");
        dayTitle.className = "day-title";
        dayTitle.textContent = `${dayInfo.day}일차 (${dayInfo.date})`;
        itineraryContainer.appendChild(dayTitle);

        // 테이블 생성
        const table = document.createElement("table");
        
        // 테이블 헤더
        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");

        const timeHeader = document.createElement("th");
        timeHeader.textContent = "시간";
        headerRow.appendChild(timeHeader);

        const activityHeader = document.createElement("th");
        activityHeader.textContent = "활동";
        headerRow.appendChild(activityHeader);

        const locationHeader = document.createElement("th");
        locationHeader.textContent = "장소";
        headerRow.appendChild(locationHeader);

        thead.appendChild(headerRow);
        table.appendChild(thead);

        // 테이블 바디
        const tbody = document.createElement("tbody");

        dayInfo.schedule.forEach(item => {
          const row = document.createElement("tr");

          const timeCell = document.createElement("td");
          timeCell.textContent = item.time;
          row.appendChild(timeCell);

          const activityCell = document.createElement("td");
          activityCell.textContent = item.activity;
          row.appendChild(activityCell);

          const locationCell = document.createElement("td");
          locationCell.textContent = item.location;
          row.appendChild(locationCell);

          tbody.appendChild(row);
        });

        table.appendChild(tbody);
        itineraryContainer.appendChild(table);
      });
    }
